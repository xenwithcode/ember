<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple ember circle -->
  <circle cx="32" cy="32" r="28" fill="url(#iconGradient)"/>
  
  <!-- Inner highlight -->
  <circle cx="26" cy="26" r="10" fill="#FFF5E6" opacity="0.5"/>
  
  <!-- Spark -->
  <circle cx="40" cy="16" r="2" fill="#FDE68A">
    <animate attributeName="cy" values="16;10;16" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <defs>
    <radialGradient id="iconGradient" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#E28766"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </radialGradient>
  </defs>
</svg>