<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#FDFBF7"/>
  
  <!-- Outer glow -->
  <circle cx="200" cy="200" r="120" fill="#E28766" opacity="0.1"/>
  <circle cx="200" cy="200" r="100" fill="#E28766" opacity="0.15"/>
  
  <!-- Main ember/flame -->
  <ellipse cx="200" cy="210" rx="60" ry="70" fill="url(#emberGradient)"/>
  
  <!-- Inner glow -->
  <ellipse cx="190" cy="195" rx="25" ry="30" fill="#FFF5E6" opacity="0.6"/>
  
  <!-- Flame particles -->
  <circle cx="175" cy="130" r="4" fill="#F59E0B" opacity="0.8">
    <animate attributeName="cy" values="130;110;130" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="120" r="3" fill="#E28766" opacity="0.7">
    <animate attributeName="cy" values="120;95;120" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="140" r="3.5" fill="#FDE68A" opacity="0.9">
    <animate attributeName="cy" values="140;115;140" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text: EMBER -->
  <text x="200" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#2C2523" letter-spacing="8">
    EMBER
  </text>
  
  <!-- Tagline -->
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8A817C" letter-spacing="2">
    Rekindle who you are
  </text>
  
  <!-- Gradient definition -->
  <defs>
    <radialGradient id="emberGradient" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#E28766"/>
      <stop offset="85%" stop-color="#C66A4D"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </radialGradient>
  </defs>
</svg>